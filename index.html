<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicLab NX100+ Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Kanit:wght@300;500&display=swap');
        
        body {
            background-color: #0b0c10;
            color: #e0e0e0;
            font-family: 'JetBrains+Mono', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .pcb-board {
            background: #1a3b2a; /* Deep PCB Green */
            background-image: 
                radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 0),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 0);
            background-size: 20px 20px, 40px 40px, 40px 40px;
            border: 12px solid #0f241a;
            border-radius: 24px;
            box-shadow: 
                0 0 50px rgba(0,0,0,0.9),
                inset 0 0 100px rgba(0,0,0,0.5);
            position: relative;
            transform-origin: center center;
            flex-shrink: 0;
        }

        .silk-label {
            color: rgba(255,255,255,0.7);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            pointer-events: none;
            text-transform: uppercase;
        }

        .breadboard {
            background: #e2e8f0;
            background-image: radial-gradient(#94a3b8 2.5px, transparent 2.5px);
            background-size: 16px 16px;
            border-radius: 8px;
            box-shadow: 
                inset 0 4px 10px rgba(0,0,0,0.2),
                0 2px 5px rgba(255,255,255,0.1);
            border: 1px solid #cbd5e1;
        }

        .nx-panel {
            background: rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
        }

        .ic-realistic {
            background: #111;
            border-radius: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            border: 1px solid #222;
        }

        .ic-pin {
            background: #bdc3c7;
            border: 1px solid #95a5a6;
            transition: all 0.1s;
            cursor: pointer;
        }

        .ic-pin:hover {
            background: #3498db;
            transform: scale(1.2);
            z-index: 60;
        }

        .wire-active {
            stroke-dasharray: 8, 4;
            animation: flow 0.8s linear infinite;
        }

        @keyframes flow {
            to { stroke-dashoffset: -12; }
        }

        .error-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #1a3b2a; border-radius: 10px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>

</html>
