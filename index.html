
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicLab NX100+ Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
        
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .pcb-board {
            background: #0a1f15;
            background-image: 
                radial-gradient(rgba(255,255,255,0.02) 1px, transparent 0),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 0),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 0);
            background-size: 20px 20px, 80px 80px, 80px 80px;
            border: 12px solid #06140e;
            border-radius: 24px;
            box-shadow: 
                0 50px 100px rgba(0,0,0,0.8),
                inset 0 0 100px rgba(0,0,0,0.5);
            position: relative;
            transform-origin: center center;
            flex-shrink: 0;
        }

        .mounting-hole {
            position: absolute;
            width: 32px;
            height: 32px;
            background: #000;
            border-radius: 50%;
            border: 4px solid #1a1a1a;
            box-shadow: inset 0 3px 6px rgba(0,0,0,1);
        }

        .silk-label {
            color: rgba(255,255,255,0.6);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 13px; /* เพิ่มจาก 9px */
            pointer-events: none;
        }

        .nx-panel {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
        }

        .breadboard-unit {
            background: #e5e7eb;
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: fit-content;
        }

        .hole-grid {
            display: grid;
            grid-template-columns: repeat(60, 8px);
            grid-template-rows: repeat(5, 8px);
            gap: 2px;
        }

        .rail-holes {
            display: grid;
            grid-template-columns: repeat(60, 8px);
            gap: 2px;
        }

        .hole {
            width: 8px;
            height: 8px;
            background: #475569;
            border-radius: 1px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }

        .power-rail { display: flex; flex-direction: column; gap: 2px; }
        .rail-line-red { height: 1.5px; background: #ef4444; width: 100%; opacity: 0.5; }
        .rail-line-blue { height: 1.5px; background: #3b82f6; width: 100%; opacity: 0.5; }

        .ic-realistic {
            background: #0f0f0f;
            border-radius: 2px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-top: 1px solid #333;
        }

        .ic-pin {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .wire-active {
            stroke-dasharray: 4, 3;
            animation: flow 0.6s linear infinite;
        }

        @keyframes flow { to { stroke-dashoffset: -7; } }

        .sidebar-transition { transition: width 0.3s ease; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
