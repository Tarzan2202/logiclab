
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicLab NX100+ Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3X40514DFZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-3X40514DFZ');
</script>
    <script type="module" src="/index.tsx"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
        
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .pcb-board {
            background: #0a1f15;
            background-image: 
                radial-gradient(rgba(255,255,255,0.02) 1px, transparent 0),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 0),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 0);
            background-size: 20px 20px, 80px 80px, 80px 80px;
            border: 12px solid #06140e;
            border-radius: 24px;
            box-shadow: 
                0 50px 100px rgba(0,0,0,0.8),
                inset 0 0 100px rgba(0,0,0,0.5);
            position: relative;
            transform-origin: center center;
            flex-shrink: 0;
        }

        .silk-label {
            color: rgba(255,255,255,0.6);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 13px; /* เพิ่มจาก 9px */
            pointer-events: none;
        }

        .nx-panel {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
        }

        .breadboard-unit {
            background: #e5e7eb;
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: fit-content;
        }

        .hole-grid {
            display: grid;
            grid-template-columns: repeat(60, 12px);
            grid-template-rows: repeat(5, 12px);
            gap: 3px;
        }

        .rail-holes {
            display: grid;
            grid-template-columns: repeat(60, 12px);
            gap: 3px;
        }

        .hole {
            width: 12px;
            height: 12px;
            background: #000000;
            border-radius: 1.5px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
        }

        .power-rail { display: flex; flex-direction: column; gap: 2px; }
        .rail-line-red { height: 1.5px; background: #ef4444; width: 100%; opacity: 0.5; }
        .rail-line-blue { height: 1.5px; background: #3b82f6; width: 100%; opacity: 0.5; }

        .ic-realistic {
            background: #ffffff;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid #333;
        }

        .ic-pin {
            background: #000000;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .wire-active {
            stroke-dasharray: 4, 3;
            animation: flow 0.6s linear infinite;
        }

        @keyframes flow { to { stroke-dashoffset: -7; } }

        .sidebar-transition { transition: width 0.3s ease; }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
